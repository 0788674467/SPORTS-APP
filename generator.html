<!DOCTYPE html>
<html>
<head>
    <title>Generate UniLeague PPTX (Deep Green Theme)</title>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #F7F9F8; }
        button { padding: 15px 30px; font-size: 18px; background-color: #1A5C35; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0D3B1E; }
    </style>
</head>
<body>
    <h1>Generating Your Presentation...</h1>
    <p>Please wait. If the download doesn't start automatically, click the button below.</p>
    <button onclick="main()">Download PowerPoint</button>

    <script>
        // ── Palette: Deep Green (forest MMU theme) ──
        const C = {
            dark:    "0D3B1E",  // deep forest green (title/section slides)
            mid:     "1A5C35",  // medium green
            accent:  "F5A623",  // warm gold accent
            light:   "E8F5EC",  // very light green for content bg
            white:   "FFFFFF",
            offWhite:"F7F9F8",
            text:    "1A2E20",  // dark green text
            muted:   "5A7A64",  // muted green text
            card:    "FFFFFF",
        };

        const makeShadow = () => ({ type: "outer", color: "000000", blur: 8, offset: 2, angle: 45, opacity: 0.10 });

        async function main() {
            const pres = new PptxGenJS();
            pres.layout = "LAYOUT_16x9";
            pres.title = "UniLeague – University Soccer League Management System";
            pres.author = "Santo Rayern & Mbambu Rosette";

            // ════════════════════════════════════════
            // SLIDE 0 – TITLE SLIDE
            // ════════════════════════════════════════
            {
                const s = pres.addSlide();
                s.background = { color: C.dark };

                // decorative circle top-right
                s.addShape(pres.shapes.OVAL, { x: 7.8, y: -0.8, w: 3.5, h: 3.5,
                fill: { color: C.mid }, line: { color: C.mid } });
                s.addShape(pres.shapes.OVAL, { x: 8.4, y: -0.5, w: 2.0, h: 2.0,
                fill: { color: "1E7040", transparency: 30 }, line: { color: "1E7040", transparency: 30 } });

                // bottom accent circle
                s.addShape(pres.shapes.OVAL, { x: -0.6, y: 4.2, w: 2.5, h: 2.5,
                fill: { color: C.accent, transparency: 70 }, line: { color: C.accent, transparency: 70 } });

                // university name
                s.addText("MOUNTAINS OF THE MOON UNIVERSITY", {
                x: 0.6, y: 0.5, w: 8.8, h: 0.45,
                fontSize: 13, bold: true, color: C.accent, fontFace: "Calibri",
                charSpacing: 2, align: "center", margin: 0
                });
                s.addText("Faculty of Science, Technology and Innovation (FOSTI)", {
                x: 0.6, y: 0.98, w: 8.8, h: 0.3,
                fontSize: 10, color: "AACFB5", fontFace: "Calibri", align: "center", margin: 0
                });
                s.addText("Department of Computer Science", {
                x: 0.6, y: 1.28, w: 8.8, h: 0.3,
                fontSize: 10, color: "AACFB5", fontFace: "Calibri", align: "center", margin: 0
                });

                // main title box
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                x: 0.6, y: 1.75, w: 8.8, h: 1.9,
                fill: { color: C.mid }, rectRadius: 0.15, shadow: makeShadow(),
                line: { color: C.mid }
                });
                s.addText("UNILEAGUE", {
                x: 0.6, y: 1.82, w: 8.8, h: 0.75,
                fontSize: 48, bold: true, color: C.white, fontFace: "Cambria",
                align: "center", margin: 0
                });
                s.addText("University Soccer League Management System", {
                x: 0.6, y: 2.58, w: 8.8, h: 0.5,
                fontSize: 16, color: C.accent, fontFace: "Calibri", italic: true,
                align: "center", margin: 0
                });
                s.addText("Case Study: Mountains of the Moon University", {
                x: 0.6, y: 3.1, w: 8.8, h: 0.3,
                fontSize: 11, color: "CCDDCC", fontFace: "Calibri", align: "center", margin: 0
                });

                // student info
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                x: 0.6, y: 3.65, w: 4.0, h: 1.4,
                fill: { color: "0A2D17" }, rectRadius: 0.1, line: { color: "0A2D17" }
                });
                s.addText([
                { text: "Santo Rayern", options: { bold: true, breakLine: true } },
                { text: "2023/U/MMU/BCS/01673", options: { breakLine: true } },
                { text: "santorayern@gmail.com", options: {} },
                ], { x: 0.6, y: 3.68, w: 4.0, h: 1.35, color: C.white, fontFace: "Calibri", fontSize: 11, align: "center", valign: "middle" });

                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                x: 5.4, y: 3.65, w: 4.0, h: 1.4,
                fill: { color: "0A2D17" }, rectRadius: 0.1, line: { color: "0A2D17" }
                });
                s.addText([
                { text: "Mbambu Rosette", options: { bold: true, breakLine: true } },
                { text: "2023/U/MMU/BIT/01795", options: { breakLine: true } },
                { text: "rossetmbambu9@mail.com", options: {} },
                ], { x: 5.4, y: 3.68, w: 4.0, h: 1.35, color: C.white, fontFace: "Calibri", fontSize: 11, align: "center", valign: "middle" });

                s.addText("Supervisor: Samuel Ocen  |  samuel.ocen@mmu.ac.ug  |  June 2026", {
                x: 0.6, y: 5.2, w: 8.8, h: 0.25,
                fontSize: 9, color: "889988", fontFace: "Calibri", align: "center", margin: 0
                });
            }

            // ════════════════════════════════════════
            // HELPER: section divider slide
            // ════════════════════════════════════════
            function sectionSlide(label, title) {
                const s = pres.addSlide();
                s.background = { color: C.dark };
                s.addShape(pres.shapes.OVAL, { x: 8.2, y: -0.5, w: 3, h: 3,
                fill: { color: C.mid }, line: { color: C.mid } });
                s.addShape(pres.shapes.OVAL, { x: -0.5, y: 3.5, w: 2, h: 2,
                fill: { color: C.accent, transparency: 75 }, line: { color: C.accent, transparency: 75 } });
                s.addText(label, {
                x: 0.7, y: 1.5, w: 8, h: 0.4,
                fontSize: 12, bold: true, color: C.accent, fontFace: "Calibri",
                charSpacing: 3, margin: 0
                });
                s.addText(title, {
                x: 0.7, y: 1.95, w: 8.2, h: 1.4,
                fontSize: 36, bold: true, color: C.white, fontFace: "Cambria", margin: 0
                });
                return s;
            }

            // HELPER: standard content slide header
            function addHeader(s, title, subtitle) {
                s.background = { color: C.offWhite };
                s.addShape(pres.shapes.RECTANGLE, {
                x: 0, y: 0, w: 10, h: 0.85,
                fill: { color: C.dark }, line: { color: C.dark }
                });
                s.addShape(pres.shapes.RECTANGLE, {
                x: 0, y: 0.85, w: 10, h: 0.06,
                fill: { color: C.accent }, line: { color: C.accent }
                });
                s.addText(title, {
                x: 0.4, y: 0.05, w: 9.2, h: 0.55,
                fontSize: 22, bold: true, color: C.white, fontFace: "Cambria",
                valign: "middle", margin: 0
                });
                if (subtitle) {
                s.addText(subtitle, {
                    x: 0.4, y: 0.6, w: 9.2, h: 0.3,
                    fontSize: 10, color: "AACFB5", fontFace: "Calibri", valign: "middle", margin: 0
                });
                }
                // slide number / footer
                s.addText("UniLeague | MMU Dept. of Computer Science | June 2026", {
                x: 0.4, y: 5.35, w: 9.2, h: 0.2,
                fontSize: 8, color: C.muted, fontFace: "Calibri", align: "right", margin: 0
                });
            }

            // ════════════════════════════════════════
            // SLIDE 1 – INTRODUCTION / BACKGROUND
            // ════════════════════════════════════════
            {
                const s = pres.addSlide();
                addHeader(s, "Introduction", "Background of the Study");

                // left text column
                s.addText([
                { text: "Global Context", options: { bold: true, color: C.dark, breakLine: true } },
                { text: "University sports increasingly depend on digital platforms for scheduling, coordination, and performance management. FISU (est. 1949) promotes digital transformation as a strategic pillar.", options: { breakLine: true } },
                { text: "\nAfrican Context", options: { bold: true, color: C.dark, breakLine: true } },
                { text: "FASU coordinates continental university sports, yet many African universities still rely on manual processes due to limited resources and infrastructure.", options: { breakLine: true } },
                { text: "\nAt MMU – Fort Portal", options: { bold: true, color: C.dark, breakLine: true } },
                { text: "The MMU soccer league was managed through paper fixture lists, spreadsheets, informal WhatsApp groups, and verbal result submission — making accurate tracking difficult.", options: {} },
                ], {
                x: 0.4, y: 1.05, w: 5.6, h: 4.3,
                fontSize: 12, color: C.text, fontFace: "Calibri",
                valign: "top", margin: 8
                });

                // right info cards
                const cards = [
                { icon: "FaGlobe",    label: "Global Body",   val: "FISU (1949)",        color: C.mid },
                { icon: "FaMapMarkerAlt", label: "Location", val: "Fort Portal, Uganda", color: "1A5C35" },
                { icon: "FaUsers",    label: "Stakeholders",  val: "88 Participants",    color: "0D3B1E" },
                { icon: "FaMobileAlt",label: "Solution",      val: "UniLeague App",      color: C.mid },
                ];
                for (let i = 0; i < 4; i++) {
                const row = Math.floor(i / 2), col = i % 2;
                const cx = 6.1 + col * 1.9, cy = 1.2 + row * 2.0;
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                    x: cx, y: cy, w: 1.75, h: 1.7,
                    fill: { color: cards[i].color }, rectRadius: 0.12,
                    shadow: makeShadow(), line: { color: cards[i].color }
                });
                s.addText(cards[i].label, {
                    x: cx + 0.08, y: cy + 0.12, w: 1.6, h: 0.35,
                    fontSize: 8, color: "AACFB5", fontFace: "Calibri",
                    bold: true, charSpacing: 1, margin: 0
                });
                s.addText(cards[i].val, {
                    x: cx + 0.08, y: cy + 0.5, w: 1.6, h: 0.95,
                    fontSize: 13, color: C.white, fontFace: "Cambria",
                    bold: true, valign: "middle", margin: 0
                });
                }
            }

            // ════════════════════════════════════════
            // SLIDE 2 – PROBLEM STATEMENT
            // ════════════════════════════════════════
            {
                const s = pres.addSlide();
                addHeader(s, "Problem Statement", "Challenges at Mountains of the Moon University");

                const problems = [
                { num: "01", title: "Fixture Conflicts",    desc: "Manual scheduling caused frequent overlaps and schedule changes." },
                { num: "02", title: "Fragmented Records",   desc: "Player data stored in disconnected spreadsheets with duplicates." },
                { num: "03", title: "Delayed Results",      desc: "Match results reported verbally, standings lagged days behind." },
                { num: "04", title: "No Audit Trails",      desc: "Substitutions & events had no traceable records, causing disputes." },
                { num: "05", title: "Poor Spectator Access",desc: "No reliable platform for fans to check fixtures or standings." },
                { num: "06", title: "Admin Overload",       desc: "Coordinators bore high manual workload with limited tools." },
                ];

                for (let i = 0; i < 6; i++) {
                const col = i % 3, row = Math.floor(i / 3);
                const x = 0.35 + col * 3.2, y = 1.1 + row * 2.15;
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                    x, y, w: 3.0, h: 1.95,
                    fill: { color: C.white }, rectRadius: 0.12,
                    shadow: makeShadow(), line: { color: "E0EDE5" }
                });
                // number badge
                s.addShape(pres.shapes.OVAL, {
                    x: x + 0.15, y: y + 0.15, w: 0.55, h: 0.55,
                    fill: { color: C.dark }, line: { color: C.dark }
                });
                s.addText(problems[i].num, {
                    x: x + 0.15, y: y + 0.15, w: 0.55, h: 0.55,
                    fontSize: 10, bold: true, color: C.white, fontFace: "Calibri",
                    align: "center", valign: "middle", margin: 0
                });
                s.addText(problems[i].title, {
                    x: x + 0.12, y: y + 0.75, w: 2.76, h: 0.35,
                    fontSize: 12, bold: true, color: C.dark, fontFace: "Cambria", margin: 0
                });
                s.addText(problems[i].desc, {
                    x: x + 0.12, y: y + 1.1, w: 2.76, h: 0.75,
                    fontSize: 10, color: C.muted, fontFace: "Calibri", margin: 0
                });
                }
            }

            // ════════════════════════════════════════
            // SLIDE 3 – OBJECTIVES & SCOPE
            // ════════════════════════════════════════
            {
                const s = pres.addSlide();
                addHeader(s, "Objectives & Scope of Study", "What UniLeague set out to achieve");

                // Main objective banner
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                x: 0.35, y: 1.08, w: 9.3, h: 0.75,
                fill: { color: C.dark }, rectRadius: 0.1, line: { color: C.dark }
                });
                s.addText("MAIN OBJECTIVE: Develop a soccer league management system that streamlines administration, enables real-time coordination, provides structured performance tracking, and enhances spectator engagement at MMU.", {
                x: 0.5, y: 1.08, w: 9.0, h: 0.75,
                fontSize: 10, color: C.white, fontFace: "Calibri", valign: "middle", margin: 4
                });

                const objs = [
                { n: "1", t: "Analyse", d: "Current soccer league management processes at MMU" },
                { n: "2", t: "Design",  d: "System architecture, database, and user interfaces" },
                { n: "3", t: "Implement", d: "A fully functional cross-platform soccer league system" },
                { n: "4", t: "Test & Evaluate", d: "System against functional and usability requirements" },
                ];
                objs.forEach((o, i) => {
                const x = 0.35 + i * 2.35, y = 2.05;
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                    x, y, w: 2.15, h: 1.75,
                    fill: { color: i % 2 === 0 ? C.mid : C.dark }, rectRadius: 0.12,
                    shadow: makeShadow(), line: { color: i % 2 === 0 ? C.mid : C.dark }
                });
                s.addText(`0${o.n}`, { x, y: y + 0.1, w: 2.15, h: 0.45,
                    fontSize: 20, bold: true, color: C.accent, fontFace: "Cambria", align: "center", margin: 0 });
                s.addText(o.t, { x, y: y + 0.52, w: 2.15, h: 0.35,
                    fontSize: 13, bold: true, color: C.white, fontFace: "Cambria", align: "center", margin: 0 });
                s.addText(o.d, { x: x + 0.1, y: y + 0.9, w: 1.95, h: 0.75,
                    fontSize: 9, color: "CCDDCC", fontFace: "Calibri", align: "center", margin: 0 });
                });

                // Scope row
                const scopes = [
                { l: "Physical Scope", v: "MMU Campus, Fort Portal City" },
                { l: "Technical Scope", v: "Flutter · Node.js · Supabase PostgreSQL" },
                { l: "Time Scope",     v: "18 Weeks: March – July 2026" },
                ];
                scopes.forEach((sc, i) => {
                const x = 0.35 + i * 3.15, y = 4.05;
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                    x, y, w: 2.95, h: 1.1,
                    fill: { color: C.light }, rectRadius: 0.1,
                    line: { color: "C8DDD0", width: 1 }
                });
                s.addText(sc.l, { x: x + 0.15, y: y + 0.08, w: 2.65, h: 0.3,
                    fontSize: 9, bold: true, color: C.muted, fontFace: "Calibri", charSpacing: 1, margin: 0 });
                s.addText(sc.v, { x: x + 0.15, y: y + 0.38, w: 2.65, h: 0.6,
                    fontSize: 11, bold: true, color: C.dark, fontFace: "Calibri", margin: 0 });
                });
            }

            // ════════════════════════════════════════
            // SLIDE 4 – LITERATURE REVIEW
            // ════════════════════════════════════════
            {
                const s = pres.addSlide();
                addHeader(s, "Literature Review & Research Gaps", "What existing research says — and where it falls short");

                // left: topics
                const topics = [
                "Sports Information Systems Theory",
                "Design Science Research (DSR) Framework",
                "Agile Software Development",
                "Round-Robin Scheduling Algorithms",
                "Cross-Platform Development (Flutter)",
                "Offline-First Design Patterns",
                "Real-Time Communication (Socket.IO)",
                ];
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                x: 0.35, y: 1.05, w: 4.6, h: 4.2,
                fill: { color: C.white }, rectRadius: 0.1,
                shadow: makeShadow(), line: { color: "E0EDE5" }
                });
                s.addText("AREAS REVIEWED", {
                x: 0.5, y: 1.1, w: 4.3, h: 0.35,
                fontSize: 10, bold: true, color: C.muted, fontFace: "Calibri", charSpacing: 2, margin: 0
                });
                s.addText(topics.map(t => ({ text: t, options: { bullet: true, breakLine: true } })).concat([{ text: "", options: {} }]),
                { x: 0.5, y: 1.45, w: 4.3, h: 3.5, fontSize: 11, color: C.text, fontFace: "Calibri", margin: 4 }
                );

                // right: gaps
                const gaps = [
                { g: "Limited East Africa Focus", d: "No study addressed resource-constrained university sports in the region." },
                { g: "No Integrated Platform",    d: "Fixture, results, real-time, and offline were treated as separate systems." },
                { g: "Commercial Bias",           d: "Existing tools (TeamSnap, LeagueApps) designed for fee-based leagues." },
                { g: "No Offline-First Sports App",d: "Integration of scheduling + offline + real-time was largely unexplored." },
                ];
                gaps.forEach((g, i) => {
                const y = 1.05 + i * 1.08;
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                    x: 5.3, y, w: 4.35, h: 0.95,
                    fill: { color: i % 2 === 0 ? C.light : C.white }, rectRadius: 0.1,
                    shadow: makeShadow(), line: { color: "E0EDE5" }
                });
                s.addShape(pres.shapes.OVAL, {
                    x: 5.42, y: y + 0.2, w: 0.45, h: 0.45,
                    fill: { color: C.accent }, line: { color: C.accent }
                });
                s.addText("!", {
                    x: 5.42, y: y + 0.2, w: 0.45, h: 0.45,
                    fontSize: 12, bold: true, color: C.white, fontFace: "Calibri",
                    align: "center", valign: "middle", margin: 0
                });
                s.addText(g.g, { x: 6.0, y: y + 0.06, w: 3.5, h: 0.28,
                    fontSize: 11, bold: true, color: C.dark, fontFace: "Calibri", margin: 0 });
                s.addText(g.d, { x: 6.0, y: y + 0.35, w: 3.5, h: 0.5,
                    fontSize: 9, color: C.muted, fontFace: "Calibri", margin: 0 });
                });
                s.addText("GAP IDENTIFIED", {
                x: 5.3, y: 1.05, w: 4.35, h: 0.3,
                fontSize: 0, color: C.offWhite, margin: 0 // invisible spacer
                });
                s.addText("IDENTIFIED RESEARCH GAPS", {
                x: 5.3, y: 1.0, w: 4.35, h: 0.3,
                fontSize: 9, bold: true, color: C.muted, fontFace: "Calibri", charSpacing: 2, margin: 0
                });
            }

            // ════════════════════════════════════════
            // SLIDE 5 – RESEARCH METHODOLOGY
            // ════════════════════════════════════════
            {
                const s = pres.addSlide();
                addHeader(s, "Research Methodology", "Design Science Research + Agile Development");

                // DSR phases - horizontal flow
                const phases = [
                { n: "1", t: "Problem\nIdentification", c: "0D3B1E" },
                { n: "2", t: "Solution\nObjectives",    c: "14522B" },
                { n: "3", t: "Design &\nDevelopment",  c: "1A5C35" },
                { n: "4", t: "Demonstration",          c: "206B40" },
                { n: "5", t: "Evaluation",             c: "277A4B" },
                { n: "6", t: "Communication",          c: "2E8956" },
                ];
                s.addText("DESIGN SCIENCE RESEARCH — 6 PHASES", {
                x: 0.35, y: 1.05, w: 9.3, h: 0.3,
                fontSize: 9, bold: true, color: C.muted, fontFace: "Calibri", charSpacing: 2, margin: 0
                });
                phases.forEach((p, i) => {
                const x = 0.35 + i * 1.56;
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                    x, y: 1.38, w: 1.45, h: 1.35,
                    fill: { color: p.c }, rectRadius: 0.1, line: { color: p.c }
                });
                s.addText(p.n, { x, y: 1.4, w: 1.45, h: 0.5,
                    fontSize: 22, bold: true, color: C.accent, fontFace: "Cambria", align: "center", margin: 0 });
                s.addText(p.t, { x, y: 1.9, w: 1.45, h: 0.75,
                    fontSize: 9, color: C.white, fontFace: "Calibri", align: "center", margin: 2 });
                if (i < 5) {
                    s.addShape(pres.shapes.LINE, {
                    x: x + 1.45, y: 2.0, w: 0.11, h: 0,
                    line: { color: C.accent, width: 2 }
                    });
                }
                });

                // data collection + sample
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                x: 0.35, y: 2.9, w: 4.5, h: 2.4,
                fill: { color: C.white }, rectRadius: 0.1,
                shadow: makeShadow(), line: { color: "E0EDE5" }
                });
                s.addText("DATA COLLECTION METHODS", {
                x: 0.5, y: 2.95, w: 4.2, h: 0.28,
                fontSize: 9, bold: true, color: C.muted, fontFace: "Calibri", charSpacing: 2, margin: 0
                });
                const methods = ["Semi-Structured Interviews", "Questionnaires", "Observation", "Document Review", "Usability Testing"];
                s.addText(methods.map(m => ({ text: m, options: { bullet: true, breakLine: true } })).concat([{ text: "", options: {} }]),
                { x: 0.5, y: 3.23, w: 4.1, h: 1.9, fontSize: 11, color: C.text, fontFace: "Calibri", margin: 4 }
                );

                // population table
                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
                x: 5.15, y: 2.9, w: 4.5, h: 2.4,
                fill: { color: C.white }, rectRadius: 0.1,
                shadow: makeShadow(), line: { color: "E0EDE5" }
                });
                s.addText("SAMPLE SIZE — 50 RESPONDENTS", {
                x: 5.3, y: 2.95, w: 4.2, h: 0.28,
                fontSize: 9, bold: true, color: C.muted, fontFace: "Calibri", charSpacing: 2, margin: 0
                });
                const rows = [

                s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
